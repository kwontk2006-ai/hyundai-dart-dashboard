
name: Collect and Analyze DART Financial Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch DART financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_dart.py

      - name: Analyze financial data
        run: python scripts/analyze_financials.py

      - name: Upload financial results
        uses: actions/upload-artifact@v4
        with:
          name: hyundai-financial-data
          path: |
            data/financial_summary.csv
            data/financial_ratios.csv
          if-no-files-found: error
          retention-days: 7
