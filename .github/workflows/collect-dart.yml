
name: Collect and Analyze DART Financial Data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-financial-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch DART financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fetch_dart.py

      - name: Analyze financial data
        run: python scripts/analyze_financials.py

      - name: Save financial data and analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data to save."
            exit 0
          fi

          git commit -m "Update Hyundai E&C financial analysis"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Financial data saved successfully."
              exit 0
            fi

            echo "Push attempt failed. Retrying..."
            sleep 5
          done

          echo "Unable to save data after 5 attempts."
          exit 1
